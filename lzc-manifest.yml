application:
  subdomain: pegasus
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://pegasus:80/
services:
  pegasus:
    # upstream: docker.io/suziwen/pegasus:1.7.0
    image: registry.lazycat.cloud/czyt/suziwen/pegasus:c52ddd140c785e24
    binds:
      - /lzcapp/var/data:/opt/couchdb/data
