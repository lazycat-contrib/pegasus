application:
  subdomain: pegasus
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://pegasus:80/
services:
  pegasus:
    # upstream: docker.io/suziwen/pegasus:1.6.0
    image: docker.io/suziwen/pegasus:1.6.0
    binds:
      - /lzcapp/var/data:/opt/couchdb/data
