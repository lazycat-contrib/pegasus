lzc-sdk-version: "0.1"
name: 小书匠
package: cloud.lazycat.app.pegasus
version: 1.6.0
description: 一款本地优先，去中心化，分布式，支持选择性同步的全平台覆盖笔记软件
homepage: https://github.com/suziwen/markdownxiaoshujiang
author: suziwen
application:
  subdomain: pegasus
  background_task: true
  multi_instance: false
  gpu_accel: false
  kvm_accel: false
  usb_accel: false
  public_path:
    - /
  routes:
    - /=http://pegasus:80/
services:
  pegasus:
    image: docker.hlmirror.com/suziwen/pegasus:1.6
    binds:
      - /lzcapp/var/data:/opt/couchdb/data
